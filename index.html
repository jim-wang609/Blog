<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#5B54E8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimon · 写代码，也写代码之外的事</title>
<meta name="description" content="Kimon 的个人博客入口。记录技术与生活。">
  <meta name="robots" content="noindex">
  <meta property="og:site_name" content="Kimon's Blog">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kimon · 写代码，也写代码之外的事">
  <meta property="og:description" content="Kimon 的个人博客入口。记录技术与生活。">
  <meta name="twitter:card" content="summary">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dialog.css">
<link rel="prefetch" href="home.html">
<script>
(function(){try{var t=localStorage.getItem('kimon-theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
</script>
<script src="assets/js/config.js"></script>
<script src="assets/js/boot.js"></script>
<script src="assets/js/dialog.js"></script>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>

<main class="start">

  <div class="start-halo" aria-hidden="true"></div>

  <a class="start-owner" href="enter.html" data-no-enter title="站主入口 · 登录后回到自己的首页或进入管理台">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="3.6"/><path d="M10.7 12.3 20 3M17 6l2 2M14 9l2 2"/></svg>
    站主入口
  </a>

  <button class="icon-btn start-theme" data-theme-toggle aria-label="切换主题">
    <svg aria-hidden="true" focusable="false" data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg aria-hidden="true" focusable="false" data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>

  <div class="start-inner">
    <span class="start-eyebrow">Personal blog</span>

    <h1 class="start-title" data-site="name">Kimon</h1>

    <p class="start-sub">写代码，也写代码之外的事</p>

    <a class="start-enter" id="enter" href="home.html">
      进入首页
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <p class="start-hint">点击任意处，或按 <kbd>Enter</kbd></p>
  </div>

  <div class="start-foot">
    © <span data-year>2026</span> <span data-site="name">Kimon</span> &nbsp;·&nbsp; <span id="foot-count"></span> 
  </div>

</main>

<script src="assets/js/remote.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  var posts = (window.POSTS || []).length;
  var cheats = window.NOTES ? window.NOTES.cheatsheets || [] : [];
  var notes = cheats.reduce(function (n, g) { return n + g.items.length; }, 0);

  var el = document.getElementById("foot-count");
  if (el) {
    el.textContent = posts + " 篇文章 · " + notes + " 条笔记";
  }
})();
</script>
<script>
(function () {
  var start = document.querySelector(".start");
  var enterLink = document.getElementById("enter");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var going = false;

  function enter(e) {
    if (e) e.preventDefault();
    if (going) return;
    going = true;

    if (reduced) {
      window.location.href = "home.html";
      return;
    }

    start.classList.add("leaving");
    setTimeout(function () {
      window.location.href = "home.html";
    }, 540);
  }

  enterLink.addEventListener("click", enter);

  start.addEventListener("click", function (e) {
    if (e.target.closest("[data-theme-toggle]")) return;
    if (e.target.closest("#enter")) return;
    /* 站主入口等独立链接不能被「点击任意处进入首页」吃掉 */
    if (e.target.closest("a")) return;
    enter(e);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      if (e.target && e.target.closest &&
          e.target.closest("a, button, input, textarea, select, summary, [contenteditable], [data-theme-toggle]")) return;
      e.preventDefault();
      enter(e);
    }
  });
})();
</script>
</body>
</html>
