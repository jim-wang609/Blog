<main id="main" tabindex="-1">
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">Guestbook</span>
      <h1>留言</h1>
      <p>不用注册，想说什么都行。看到都会回。</p>
    </div>
  </div>

  <section class="section" style="padding-top:0" id="guestbook">
    <div class="container" data-guestbook>
      <div class="guestbook-grid">
        <aside class="gb-compose">
          <div class="gb-compose-head">
            <span class="eyebrow">Write a note</span>
            <h2>贴一张便签</h2>
            <p>写点什么，贴到留言板上。</p>
          </div>
          <div class="auth-box" data-flash aria-live="polite"></div>

          <form class="gb-form">
            <div class="gb-field">
              <label class="gb-label" for="gb-name">
                你的称呼
                <span class="opt">留空则显示「匿名访客」</span>
              </label>
              <div class="gb-input-wrap">
                <span class="gb-mini-av" id="gb-preview" aria-hidden="true">?</span>
                <input class="field" id="gb-name" type="text" name="name" placeholder="比如：阿泽" maxlength="20" autocomplete="off">
              </div>
            </div>

            <div class="gb-field">
              <label class="gb-label" for="gb-body">留言内容</label>
              <textarea class="field" id="gb-body" name="body" rows="4" placeholder="说点什么…" maxlength="300"></textarea>
            </div>

            <button class="btn btn-primary" type="submit" style="justify-content:center">贴到板上</button>
            <p class="gb-hint" data-gb-hint>
              称呼会记在这台设备上，下次自动填好。留言保存到站点数据库，发布后立即显示。
            </p>
          </form>
        </aside>

        <div class="gb-board">
          <div class="gb-board-head">
            <div>
              <span class="eyebrow">The board</span>
              <h2>留言板</h2>
            </div>
            <span class="gb-board-count" data-gb-count>0 张便签</span>
          </div>
          <div class="gb-notes" data-gb-list></div>
        </div>
      </div>
    </div>
  </section>
</main>
