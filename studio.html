<body class="studio">

<a class="skip-link" href="#view">跳到正文</a>

  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>

<div class="st-shell">
  <aside class="st-side">
    <a class="st-brand" href="home.html">
      <span class="mk">K</span>
      <span>Kimon<small>Studio</small></span>
    </a>

    <button class="st-nav-item on" data-view="overview">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>
      <span>概览</span>
    </button>
    <button class="st-nav-item" data-view="posts">

    </button>
    <button class="st-nav-item" data-view="comments">

    <button class="st-nav-item" data-view="notes">

    <button class="st-nav-item" data-view="resources">

      <span>资源</span>

    <button class="st-nav-item" data-view="gallery">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>

    <button class="st-nav-item" data-view="terms">

    </button>

    <div class="st-side-foot">
      <a class="st-link" href="home.html" target="_blank" rel="noopener">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-8 8M10 4H4v16h16v-6"/></svg>
        查看站点
      </a>
      <button class="st-link" id="btn-theme" type="button" style="background:none;border:none;cursor:pointer;padding:0">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
        切换主题
      </button>
      <button class="st-link" id="btn-logout" type="button" style="background:none;border:none;cursor:pointer;padding:0">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>

  <main class="st-main" id="view" tabindex="-1">
    <div class="st-empty">载入中…</div>
  </main>

<!-- 登录 / 初始化 -->
<div class="st-gate" id="gate" hidden>
  <div class="st-gate-card">
    <h2 id="gate-title">登录管理台</h2>
    <p id="gate-desc">输入管理员密码后即可管理文章、评论与资源。</p>

    <div class="st-field">
      <label for="gate-user">账号</label>
      <input class="st-input" id="gate-user" placeholder="你的管理员账号" autocomplete="username">
    </div>
    <div class="st-field">
      <label for="gate-pass">密码</label>
      <input class="st-input" id="gate-pass" type="password" autocomplete="current-password">
    </div>
    <div class="st-field" id="gate-pass2-wrap" hidden>
      <label for="gate-pass2">再输一次</label>
      <input class="st-input" id="gate-pass2" type="password" autocomplete="new-password">
    </div>

    <button class="st-btn primary" id="gate-submit" style="width:100%;justify-content:center;margin-top:16px">进入</button>
    <div class="st-gate-msg" id="gate-msg"></div>
    <p style="margin:18px 0 0;text-align:center;font-size:12px">
      <a href="enter.html?next=studio.html" style="color:var(--accent-text)">从站主入口登录</a>
      <span style="color:var(--text-3)"> · </span>
      <a href="home.html" style="color:var(--text-3)">回首页</a>
    </p>
  </div>
</div>

<div class="st-toast" id="toast"></div>

<script src="assets/js/markdown.js"></script>
<script src="assets/js/studio.js"></script>
