<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="home.html"><span class="brand-mark">K</span>Kimon</a>
    <nav class="nav" id="site-nav" aria-label="主导航">

    </nav>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="切换主题">
        <svg aria-hidden="true" focusable="false" data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

      </button>
      <button class="icon-btn nav-toggle" data-nav-toggle aria-label="菜单" aria-controls="site-nav" aria-expanded="false">

      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="container">
    <div class="article-layout">

      <article>
        <header class="article-head" id="post-head"></header>

        <div class="prose" id="post-body"></div>

        <div class="article-foot">
          <div id="post-tags" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px"></div>
          <div class="pager" id="post-pager"></div>
        </div>
      </article>

      <aside>
        <div class="toc" data-toc id="post-toc"></div>

        <div class="side-card" id="post-related-card" style="margin-top:24px">
          <h3>相关阅读</h3>
          <div style="display:flex;flex-direction:column;gap:10px" id="post-related"></div>
        </div>

        <div class="side-card" style="margin-top:16px">
          <h3>回到</h3>
          <div style="display:flex;flex-direction:column;gap:8px">
            <a href="tech.html" style="font-size:12.5px;color:var(--text-2)">全部技术文章 →</a>
            <a href="notes.html" style="font-size:12.5px;color:var(--text-2)">速查笔记 →</a>
            <a href="guestbook.html" style="font-size:12.5px;color:var(--text-2)">留言板 →</a>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <section class="section section-alt" id="comments" data-post-comments hidden>
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Comments</span>
          <h2>评论</h2>
          <p>不用注册也能说两句，填个称呼就行。</p>
        </div>
      </div>

      <div class="guestbook-grid">
        <div>
          <div class="auth-box" data-flash aria-live="polite"></div>
          <form class="gb-form">
            <div class="gb-field">
              <label class="gb-label" for="cmt-name">你的称呼</label>
              <div class="gb-input-wrap">
                <span class="gb-mini-av" aria-hidden="true">?</span>
                <input class="field" id="cmt-name" type="text" name="name" placeholder="留空则显示匿名访客" maxlength="20" autocomplete="off">
              </div>
            </div>
            <div class="gb-field">
              <label class="gb-label" for="cmt-body">说点什么</label>
              <textarea class="field" id="cmt-body" name="body" rows="4" placeholder="对这篇有什么想法…" maxlength="600"></textarea>
            </div>
            <button class="btn btn-primary" type="submit" style="justify-content:center">发表评论</button>
          </form>
        </div>
        <div class="gb-list" data-cmt-list></div>
      </div>
    </div>
  </section>
</main>
